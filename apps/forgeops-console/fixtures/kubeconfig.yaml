apiVersion: v1
kind: Config
clusters:
  - name: fixture-cluster
    cluster:
      server: https://127.0.0.1:65535
contexts:
  - name: fixture
    context:
      cluster: fixture-cluster
      user: fixture-user
      namespace: default
current-context: fixture
users:
  - name: fixture-user
    user:
      token: synthetic-c2-token-not-a-secret
