apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: service-pulse-board-private-ingress
  namespace: forge-pulse
spec:
  podSelector:
    matchLabels:
      app: service-pulse-board
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: forge-gateway
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 8080
