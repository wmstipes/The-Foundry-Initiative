apiVersion: apps/v1
kind: Deployment
metadata:
  name: restaurant-api
  namespace: forge-restaurant
  labels:
    app: restaurant-api
    project: signalforge
spec:
  replicas: 3
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: restaurant-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: restaurant-api
        project: signalforge
    spec:
      containers:
      - name: restaurant-api
        image: wmstipes/signalforge-restaurant-api:0.5.0
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: restaurant-api-config
        ports:
        - containerPort: 8000
          name: http
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 15
          periodSeconds: 20
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
