apiVersion: v1
kind: Pod
metadata:
  name: loki-restore-extract
  namespace: forge-observability
  labels:
    app: loki-restore-extract
    project: signalforge
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  nodeSelector:
    kubernetes.io/hostname: forge-head
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule
  containers:
  - name: extract
    image: busybox:1.37.0@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
    command: [/bin/sh, -c, "sleep 900"]
    resources:
      requests: {cpu: 5m, memory: 8Mi}
      limits: {cpu: 100m, memory: 64Mi}
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: [ALL]
    volumeMounts:
    - name: restored-data
      mountPath: /validation
  volumes:
  - name: restored-data
    hostPath:
      path: /mnt/signalforge-loki/restore-validation
      type: Directory
