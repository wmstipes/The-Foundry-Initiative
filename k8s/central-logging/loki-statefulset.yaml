apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: loki
  namespace: forge-observability
  labels:
    app: loki
    project: signalforge
spec:
  serviceName: loki
  replicas: 1
  selector:
    matchLabels:
      app: loki
  template:
    metadata:
      labels:
        app: loki
        project: signalforge
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      containers:
      - name: loki
        image: grafana/loki:3.7.0@sha256:c316b7c7589a5eeca843b6926c7446149d18300b79ac8538dc4ae063bc478da2
        args: ["-config.file=/etc/loki/config.yaml", "-target=all"]
        ports:
        - name: http
          containerPort: 3100
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 768Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        startupProbe:
          httpGet:
            path: /ready
            port: http
          periodSeconds: 5
          failureThreshold: 36
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /ready
            port: http
          periodSeconds: 30
          failureThreshold: 3
        volumeMounts:
        - name: data
          mountPath: /var/loki
        - name: config
          mountPath: /etc/loki
          readOnly: true
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: loki-data
      - name: config
        configMap:
          name: loki-config
      - name: tmp
        emptyDir:
          sizeLimit: 64Mi
