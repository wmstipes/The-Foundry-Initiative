apiVersion: v1
kind: Pod
metadata:
  name: loki-restore-validation
  namespace: forge-observability
  labels:
    app: loki-restore-validation
    project: signalforge
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  nodeSelector:
    kubernetes.io/hostname: forge-head
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule
  containers:
  - name: loki
    image: grafana/loki:3.7.0@sha256:c316b7c7589a5eeca843b6926c7446149d18300b79ac8538dc4ae063bc478da2
    args: ["-config.file=/etc/loki/config.yaml", "-target=all", "-server.http-listen-port=3101"]
    ports:
    - name: http
      containerPort: 3101
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {cpu: 500m, memory: 768Mi}
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: [ALL]
    startupProbe:
      httpGet: {path: /ready, port: http}
      periodSeconds: 5
      failureThreshold: 36
    readinessProbe:
      httpGet: {path: /ready, port: http}
      periodSeconds: 10
    volumeMounts:
    - name: restored-data
      mountPath: /var/loki
    - name: config
      mountPath: /etc/loki
      readOnly: true
    - name: tmp
      mountPath: /tmp
  volumes:
  - name: restored-data
    hostPath:
      path: /mnt/signalforge-loki/restore-validation
      type: Directory
  - name: config
    configMap:
      name: loki-config
  - name: tmp
    emptyDir:
      sizeLimit: 64Mi
