apiVersion: v1
kind: ServiceAccount
metadata:
  name: pulse-alloy
  namespace: forge-observability
  labels:
    app: pulse-alloy
    project: signalforge
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pulse-log-reader
  namespace: forge-pulse
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pulse-log-reader
  namespace: forge-pulse
roleRef:
  kind: Role
  name: pulse-log-reader
  apiGroup: rbac.authorization.k8s.io
subjects:
- kind: ServiceAccount
  name: pulse-alloy
  namespace: forge-observability
