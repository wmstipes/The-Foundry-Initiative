apiVersion: v1
kind: ConfigMap
metadata:
  name: pulse-alloy-config
  namespace: forge-observability
  labels:
    app: pulse-alloy
    project: signalforge
data:
  config.alloy: |
    discovery.kubernetes "pulse" {
      role = "pod"
      namespaces {
        names = ["forge-pulse"]
      }
    }
    discovery.relabel "pulse" {
      targets = discovery.kubernetes.pulse.targets
      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        target_label  = "container"
      }
    }
    loki.source.kubernetes "pulse" {
      targets    = discovery.relabel.pulse.output
      forward_to = [loki.write.local.receiver]
    }
    loki.write "local" {
      endpoint {
        url = "http://loki.forge-observability.svc.cluster.local:3100/loki/api/v1/push"
      }
    }
