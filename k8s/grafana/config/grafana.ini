[server]
http_port = 3000
root_url = https://grafana.forge.home.arpa/
[auth.anonymous]
enabled = false
[users]
allow_sign_up = false
[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false
[plugins]
preinstall_disabled = true
[log]
mode = console
level = info
[security]
disable_gravatar = true
cookie_secure = true
[snapshots]
enabled = false
external_enabled = false
[unified_alerting]
enabled = false
