apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: lab-api
  namespace: forge-mesh-lab
spec:
  host: lab-api
  subsets:
  - name: v1
    labels: {version: v1}
  - name: v2
    labels: {version: v2}
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: lab-api
  namespace: forge-mesh-lab
spec:
  hosts: [lab-api]
  http:
  - route:
    - destination: {host: lab-api, subset: v1}
