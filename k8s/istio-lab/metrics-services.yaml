# Expose only Envoy metrics inside the cluster. Apply during an active meshed
# lab session; delete these Services when the session ends.
apiVersion: v1
kind: Service
metadata:
  name: lab-client-metrics
  namespace: forge-mesh-lab
spec:
  type: ClusterIP
  selector: {app: lab-client}
  ports:
  - {name: metrics, port: 15090, targetPort: 15090}
---
apiVersion: v1
kind: Service
metadata:
  name: lab-api-v1-metrics
  namespace: forge-mesh-lab
spec:
  type: ClusterIP
  selector: {app: lab-api, version: v1}
  ports:
  - {name: metrics, port: 15090, targetPort: 15090}
---
apiVersion: v1
kind: Service
metadata:
  name: lab-api-v2-metrics
  namespace: forge-mesh-lab
spec:
  type: ClusterIP
  selector: {app: lab-api, version: v2}
  ports:
  - {name: metrics, port: 15090, targetPort: 15090}
