apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: prometheus-lan-auth
  namespace: forge-observability
spec:
  basicAuth:
    secret: prometheus-lan-auth
    realm: Forge Prometheus
    removeHeader: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: prometheus-lan
  namespace: forge-observability
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: forge-observability-prometheus-lan-auth@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: prometheus.forge.home.arpa
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: prometheus
                port:
                  number: 9090
