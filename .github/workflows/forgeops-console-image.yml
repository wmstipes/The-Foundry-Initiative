name: ForgeOps Console cluster image

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/forgeops-console/**"
      - "k8s/forgeops-console/**"
      - ".github/workflows/forgeops-console-image.yml"
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Reviewed full main commit SHA; required for publication"
        required: true
        type: string
      version:
        description: "Version without v (for example 0.1.0); publish only from main"
        required: true
        type: string

permissions:
  contents: read

env:
  IMAGE_NAME: wmstipes/signalforge-forgeops-console

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Smoke test in-cluster startup on AMD64
        shell: bash
        run: |
          set -euo pipefail
          image="forgeops-console:smoke-${GITHUB_SHA}"
          container="forgeops-console-smoke-${GITHUB_RUN_ID}"
          cleanup() {
            docker logs "$container" 2>/dev/null || true
            docker rm --force "$container" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker build --platform linux/amd64 --tag "$image" -f apps/forgeops-console/Dockerfile .
          docker run --detach --name "$container" \
            --publish 127.0.0.1:19090:9090 \
            --read-only --security-opt no-new-privileges:true --cap-drop ALL \
            "$image"
          ready=false
          for attempt in {1..30}; do
            if curl --fail --silent --show-error \
              -H 'Host: forgeops.forge.home.arpa' \
              http://127.0.0.1:19090/healthz 2>/dev/null | grep --quiet '"status":"ok"'; then
              ready=true
              break
            fi
            sleep 1
          done
          test "$ready" = true
          test "$(curl --silent -o /dev/null -w '%{http_code}' http://127.0.0.1:19090/healthz)" = 403
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/forgeops-console/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          tags: ${{ env.IMAGE_NAME }}:ci-${{ github.sha }}

  publish:
    needs: validate
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    environment: release
    concurrency:
      group: release-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate version
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Verify reviewed main source and unused version
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
          VERSION: ${{ inputs.version }}
        run: python scripts/validate-publication.py --image "$IMAGE_NAME" --version "$VERSION"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/forgeops-console/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ inputs.version }}
      - name: Record immutable image identity
        shell: bash
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          VERSION: ${{ inputs.version }}
        run: |
          echo "Image: wmstipes/signalforge-forgeops-console:${VERSION}@${DIGEST}" >> "$GITHUB_STEP_SUMMARY"
