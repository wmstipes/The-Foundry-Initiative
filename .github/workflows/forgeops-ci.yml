name: ForgeOps CI

on:
  push:
    branches:
      - main
    paths:
      - "src/forgeops/**"
      - "tests/test_forgeops*.py"
      - "tests/fixtures/forgeops/**"
      - "pyproject.toml"
      - ".github/workflows/forgeops-ci.yml"

  pull_request:
    branches:
      - main
    paths:
      - "src/forgeops/**"
      - "tests/test_forgeops*.py"
      - "tests/fixtures/forgeops/**"
      - "pyproject.toml"
      - ".github/workflows/forgeops-ci.yml"

  workflow_dispatch:

jobs:
  test:
    name: Test ForgeOps offline
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Install local package
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Run ForgeOps tests
        run: python -m unittest discover -s tests -p 'test_forgeops*.py' -v

      - name: Verify both command entry points
        run: |
          foundry-check --help
          forgeops provenance
          python scripts/run-forgeops-dev.py provenance
          forgeops snapshot --help
          forgeops evidence validate --help
          forgeops evidence compare --help
          forgeops evidence validate --input tests/fixtures/forgeops/evaluated-json-golden.json
          forgeops evidence compare --before tests/fixtures/forgeops/evaluated-json-golden.json --after tests/fixtures/forgeops/evaluated-json-golden.json
          forgeops evidence compare --before tests/fixtures/forgeops/evaluated-json-golden.json --after tests/fixtures/forgeops/evaluated-json-golden.json --format json
          forgeops evidence integrity create --input tests/fixtures/forgeops/evaluated-json-golden.json
          forgeops evidence integrity verify --input tests/fixtures/forgeops/evaluated-json-golden.json --record tests/fixtures/forgeops/evaluated-json-golden.integrity.json
          forgeops scenario replay --before tests/fixtures/forgeops/scenarios/stable-baseline/before.json --after tests/fixtures/forgeops/scenarios/stable-baseline/after.json --expected tests/fixtures/forgeops/scenarios/stable-baseline/expected-comparison.json
          forgeops runbook catalog validate --input docs/reference/forgeops-runbook-catalog.json
          forgeops runbook map --comparison tests/fixtures/forgeops/scenarios/routing-regression/expected-comparison.json --catalog docs/reference/forgeops-runbook-catalog.json
          forgeops runbook map --comparison tests/fixtures/forgeops/scenarios/routing-regression/expected-comparison.json --catalog docs/reference/forgeops-runbook-catalog.json --format json
