name: ForgeOps CI

on:
  push:
    branches: [main]
    paths:
      - "src/forgeops/**"
      - "tests/test_forgeops*.py"
      - "tests/fixtures/forgeops/**"
      - "scripts/build-forgeops-release.py"
      - "scripts/validate-forgeops-release.py"
      - "pyproject.toml"
      - "LICENSE"
      - ".github/workflows/forgeops-ci.yml"
      - ".github/workflows/forgeops-release.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/forgeops/**"
      - "tests/test_forgeops*.py"
      - "tests/fixtures/forgeops/**"
      - "scripts/build-forgeops-release.py"
      - "scripts/validate-forgeops-release.py"
      - "pyproject.toml"
      - "LICENSE"
      - ".github/workflows/forgeops-ci.yml"
      - ".github/workflows/forgeops-release.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUTF8: "1"

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install exact build backend and source
        run: |
          python -m pip install setuptools==84.0.0 wheel==0.48.0
          python -m pip install . --no-build-isolation
      - name: Run ForgeOps tests
        run: python -m unittest discover -s tests -p 'test_forgeops*.py' -v
      - name: Confirm source installation identity
        run: |
          forgeops provenance
          python scripts/run-forgeops-dev.py provenance

  build-candidate:
    name: Build exact candidate wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - name: Install exact build backend
        run: python -m pip install setuptools==84.0.0 wheel==0.48.0
      - name: Build twice and prove byte reproducibility
        run: |
          python scripts/build-forgeops-release.py --output-dir dist
          python scripts/build-forgeops-release.py --output-dir dist-repeat
          python scripts/validate-forgeops-release.py --dist-dir dist
          python scripts/validate-forgeops-release.py --dist-dir dist-repeat
          cmp dist/signalforge_forgeops-1.0.0-py3-none-any.whl dist-repeat/signalforge_forgeops-1.0.0-py3-none-any.whl
          cmp dist/SHA256SUMS.txt dist-repeat/SHA256SUMS.txt
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: forgeops-v1-candidate
          path: dist/
          if-no-files-found: error
          retention-days: 14

  install-candidate:
    name: Install candidate on Python ${{ matrix.python-version }}
    needs: build-candidate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.1
        with:
          name: forgeops-v1-candidate
          path: dist
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate and install without a registry
        run: |
          python scripts/validate-forgeops-release.py --dist-dir dist
          python -m pip install --no-index dist/signalforge_forgeops-1.0.0-py3-none-any.whl
      - name: Exercise installed offline commands
        working-directory: ${{ runner.temp }}
        run: |
          forgeops provenance
          forgeops --help
          python -m forgeops --help
          forgeops snapshot --help
          forgeops evidence validate --input "$GITHUB_WORKSPACE/tests/fixtures/forgeops/evaluated-json-golden.json"
          forgeops evidence compare --before "$GITHUB_WORKSPACE/tests/fixtures/forgeops/evaluated-json-golden.json" --after "$GITHUB_WORKSPACE/tests/fixtures/forgeops/evaluated-json-golden.json" --format json
          forgeops evidence integrity create --input "$GITHUB_WORKSPACE/tests/fixtures/forgeops/evaluated-json-golden.json" > integrity.json
          forgeops evidence integrity verify --input "$GITHUB_WORKSPACE/tests/fixtures/forgeops/evaluated-json-golden.json" --record integrity.json
          forgeops scenario replay --before "$GITHUB_WORKSPACE/tests/fixtures/forgeops/scenarios/stable-baseline/before.json" --after "$GITHUB_WORKSPACE/tests/fixtures/forgeops/scenarios/stable-baseline/after.json" --expected "$GITHUB_WORKSPACE/tests/fixtures/forgeops/scenarios/stable-baseline/expected-comparison.json"
          forgeops runbook catalog validate --input "$GITHUB_WORKSPACE/docs/reference/forgeops-runbook-catalog.json"
          forgeops runbook map --comparison "$GITHUB_WORKSPACE/tests/fixtures/forgeops/scenarios/routing-regression/expected-comparison.json" --catalog "$GITHUB_WORKSPACE/docs/reference/forgeops-runbook-catalog.json" --format json > mapping.json
          forgeops runbook mapping validate --input mapping.json
          forgeops incident brief --comparison "$GITHUB_WORKSPACE/tests/fixtures/forgeops/scenarios/routing-regression/expected-comparison.json" --mapping mapping.json --format json
          forgeops incident replay --comparison "$GITHUB_WORKSPACE/tests/fixtures/forgeops/scenarios/routing-regression/expected-comparison.json" --mapping mapping.json --expected "$GITHUB_WORKSPACE/tests/fixtures/forgeops/scenarios/routing-regression/expected-incident-brief.json"
