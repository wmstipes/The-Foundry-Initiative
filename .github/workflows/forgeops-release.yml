name: ForgeOps Release

on:
  push:
    tags:
      - "forgeops-v*"

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUTF8: "1"

jobs:
  test:
    name: Test tag on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: |
          python -m pip install setuptools==84.0.0 wheel==0.48.0
          python -m pip install . --no-build-isolation
          python -m unittest discover -s tests -p 'test_forgeops*.py' -v

  build:
    name: Build exact tagged wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Require exact product tag
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "$GITHUB_REF_NAME" = "forgeops-v${version}"
      - name: Build and validate reproducible wheel
        run: |
          python -m pip install setuptools==84.0.0 wheel==0.48.0
          python scripts/build-forgeops-release.py --output-dir dist
          python scripts/build-forgeops-release.py --output-dir dist-repeat
          python scripts/validate-forgeops-release.py --dist-dir dist
          python scripts/validate-forgeops-release.py --dist-dir dist-repeat
          cmp dist/signalforge_forgeops-1.0.0-py3-none-any.whl dist-repeat/signalforge_forgeops-1.0.0-py3-none-any.whl
          cmp dist/SHA256SUMS.txt dist-repeat/SHA256SUMS.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: forgeops-v1-release
          path: dist/
          if-no-files-found: error
          retention-days: 14

  install:
    name: Install tagged wheel on Python ${{ matrix.python-version }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: forgeops-v1-release
          path: dist
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate, install offline, and smoke test
        run: |
          python scripts/validate-forgeops-release.py --dist-dir dist
          python -m pip install --no-index dist/signalforge_forgeops-1.0.0-py3-none-any.whl
          cd "$RUNNER_TEMP"
          forgeops provenance
          forgeops --help
          python -m forgeops --help
          forgeops evidence validate --input "$GITHUB_WORKSPACE/tests/fixtures/forgeops/evaluated-json-golden.json"
          forgeops scenario replay --before "$GITHUB_WORKSPACE/tests/fixtures/forgeops/scenarios/stable-baseline/before.json" --after "$GITHUB_WORKSPACE/tests/fixtures/forgeops/scenarios/stable-baseline/after.json" --expected "$GITHUB_WORKSPACE/tests/fixtures/forgeops/scenarios/stable-baseline/expected-comparison.json"

  publish:
    name: Publish approved GitHub Release
    needs: [test, build, install]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: forgeops-v1-release
          path: dist
      - name: Publish only tested assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/signalforge_forgeops-1.0.0-py3-none-any.whl \
            dist/SHA256SUMS.txt \
            --verify-tag \
            --title "ForgeOps v1.0.0" \
            --notes-file docs/releases/forgeops-v1.0.0.md
