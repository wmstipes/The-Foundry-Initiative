name: Restaurant API CI

on:
  push:
    branches:
      - main
    paths:
      - "apps/restaurant-api/**"
      - ".github/workflows/restaurant-api-ci.yml"

  pull_request:
    branches:
      - main
    paths:
      - "apps/restaurant-api/**"
      - ".github/workflows/restaurant-api-ci.yml"

  workflow_dispatch:

jobs:
  test:
    name: Test Restaurant API
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/restaurant-api

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: |
          python -m pytest -q
