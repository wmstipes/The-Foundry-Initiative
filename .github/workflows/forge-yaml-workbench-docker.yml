name: Forge YAML Workbench Docker Build

on:
  pull_request:
    branches:
      - main
    paths:
      - "apps/forge-yaml-workbench/**"
      - ".github/workflows/forge-yaml-workbench-docker.yml"

  push:
    tags:
      - "forge-yaml-workbench-v*.*.*"

  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the versioned image to Docker Hub"
        required: true
        type: boolean
        default: false
      version:
        description: "Image version without a v prefix, for example 0.1.0"
        required: false
        type: string

permissions:
  contents: read

env:
  IMAGE_NAME: wmstipes/signalforge-yaml-workbench

jobs:
  validate:
    name: Build AMD64 and ARM64 image
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && !inputs.publish) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and smoke test native container
        shell: bash
        working-directory: apps/forge-yaml-workbench
        env:
          SMOKE_IMAGE: forge-yaml-workbench:smoke-${{ github.sha }}
          SMOKE_CONTAINER: forge-yaml-workbench-smoke-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail

          cleanup() {
            docker logs "${SMOKE_CONTAINER}" 2>/dev/null || true
            docker rm --force "${SMOKE_CONTAINER}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker build --tag "${SMOKE_IMAGE}" .
          docker run --detach \
            --name "${SMOKE_CONTAINER}" \
            --publish 127.0.0.1:18080:8080 \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=32m \
            --security-opt no-new-privileges:true \
            --cap-drop ALL \
            "${SMOKE_IMAGE}"

          ready=false
          for attempt in {1..30}; do
            if [[ "$(curl --fail --silent --show-error http://127.0.0.1:18080/healthz 2>/dev/null || true)" == "ok" ]]; then
              ready=true
              break
            fi
            sleep 1
          done

          if [[ "${ready}" != "true" ]]; then
            echo "container did not become healthy within 30 seconds" >&2
            exit 1
          fi

          headers="${RUNNER_TEMP}/forge-yaml-workbench-headers.txt"
          normalized_headers="${RUNNER_TEMP}/forge-yaml-workbench-headers-normalized.txt"
          body="${RUNNER_TEMP}/forge-yaml-workbench-index.html"
          curl --fail --silent --show-error \
            --dump-header "${headers}" \
            --output "${body}" \
            http://127.0.0.1:18080/
          tr -d '\r' < "${headers}" > "${normalized_headers}"

          test "$(docker exec "${SMOKE_CONTAINER}" id -u)" != "0"
          grep --fixed-strings --quiet '<title>Forge YAML Workbench</title>' "${body}"
          grep --extended-regexp --ignore-case --quiet '^x-content-type-options:[[:space:]]*nosniff$' "${normalized_headers}"
          grep --extended-regexp --ignore-case --quiet '^x-frame-options:[[:space:]]*DENY$' "${normalized_headers}"
          grep --extended-regexp --ignore-case --quiet '^referrer-policy:[[:space:]]*no-referrer$' "${normalized_headers}"
          grep --extended-regexp --ignore-case --quiet '^content-security-policy:' "${normalized_headers}"

      - name: Build image without publishing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: apps/forge-yaml-workbench
          file: apps/forge-yaml-workbench/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          tags: ${{ env.IMAGE_NAME }}:ci-${{ github.sha }}

  publish:
    name: Publish AMD64 and ARM64 image
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Prepare versioned publication
        id: release
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            VERSION="${GITHUB_REF_NAME#forge-yaml-workbench-v}"
          else
            VERSION="${REQUESTED_VERSION}"
          fi

          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "version must use MAJOR.MINOR.PATCH without a v prefix" >&2
            exit 1
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish versioned image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: apps/forge-yaml-workbench
          file: apps/forge-yaml-workbench/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ steps.release.outputs.version }}
