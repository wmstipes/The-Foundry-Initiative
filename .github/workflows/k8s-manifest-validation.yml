name: Kubernetes Manifest Validation

on:
  push:
    branches:
      - main
    paths:
      - "k8s/**"
      - "scripts/validate-k8s-manifests.py"
      - ".github/workflows/k8s-manifest-validation.yml"

  pull_request:
    branches:
      - main
    paths:
      - "k8s/**"
      - "scripts/validate-k8s-manifests.py"
      - ".github/workflows/k8s-manifest-validation.yml"

  workflow_dispatch:

jobs:
  validate:
    name: Validate Kubernetes manifests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml==6.0.2

      - name: Validate manifests
        run: |
          python scripts/validate-k8s-manifests.py

      - name: Extract Prometheus configuration
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import yaml

          manifest = yaml.safe_load(
              Path("k8s/prometheus/prometheus-config.yaml").read_text(encoding="utf-8-sig")
          )
          output = Path(os.environ["RUNNER_TEMP"]) / "prometheus.yml"
          output.write_text(manifest["data"]["prometheus.yml"], encoding="utf-8")
          PY

      - name: Validate Prometheus configuration with promtool
        run: |
          docker run --rm \
            --entrypoint /bin/promtool \
            --volume "$RUNNER_TEMP/prometheus.yml:/etc/prometheus/prometheus.yml:ro" \
            prom/prometheus:v3.13.2 \
            check config /etc/prometheus/prometheus.yml
