name: Kubernetes Manifest Validation

on:
  push:
    branches:
      - main
    paths:
      - "k8s/**"
      - "scripts/validate-k8s-manifests.py"
      - "scripts/manage-prometheus-alerts.ps1"
      - "scripts/*grafana*"
      - "tests/test_grafana*.py"
      - "tests/test_prometheus_alert_activation.py"
      - ".github/workflows/k8s-manifest-validation.yml"

  pull_request:
    branches:
      - main
    paths:
      - "k8s/**"
      - "scripts/validate-k8s-manifests.py"
      - "scripts/manage-prometheus-alerts.ps1"
      - "scripts/*grafana*"
      - "tests/test_grafana*.py"
      - "tests/test_prometheus_alert_activation.py"
      - ".github/workflows/k8s-manifest-validation.yml"

  workflow_dispatch:

jobs:
  validate:
    name: Validate Kubernetes manifests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml==6.0.2

      - name: Validate manifests
        run: |
          python scripts/validate-k8s-manifests.py
          python -m unittest discover -s tests -p 'test_grafana*.py'
          python -m unittest discover -s tests -p 'test_prometheus_alert_activation.py'

      - name: Parse guarded alert operator helper
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD/scripts/manage-prometheus-alerts.ps1",
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }

      - name: Extract Prometheus configuration
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import yaml

          manifest = yaml.safe_load(
              Path("k8s/prometheus/prometheus-config.yaml").read_text(encoding="utf-8-sig")
          )
          output = Path(os.environ["RUNNER_TEMP"]) / "prometheus-config"
          output.mkdir()
          (output / "prometheus.yml").write_text(
              manifest["data"]["prometheus.yml"], encoding="utf-8"
          )
          (output / "restaurant-scrape.rules.yaml").write_text(
              manifest["data"]["restaurant-scrape.rules.yaml"], encoding="utf-8"
          )
          PY

      - name: Validate Grafana panel PromQL and idle traffic behavior
        run: |
          python scripts/export-grafana-query-tests.py "$RUNNER_TEMP/grafana-query-tests.yaml"
          docker run --rm \
            --entrypoint /bin/promtool \
            --volume "$RUNNER_TEMP/grafana-query-tests.yaml:/tmp/grafana-query-tests.yaml:ro" \
            prom/prometheus:v3.13.2 \
            test rules /tmp/grafana-query-tests.yaml

      - name: Validate Prometheus configuration with promtool
        run: |
          docker run --rm \
            --entrypoint /bin/promtool \
            --volume "$RUNNER_TEMP/prometheus-config:/etc/prometheus:ro" \
            prom/prometheus:v3.13.2 \
            check config /etc/prometheus/prometheus.yml
