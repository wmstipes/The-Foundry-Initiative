name: Required Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUTF8: "1"

jobs:
  python:
    name: Complete Python validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install exact dependencies
        run: |
          python -m pip install setuptools==84.0.0 wheel==0.48.0
          python -m pip install . --no-build-isolation
          python -m pip install \
            -r apps/restaurant-api/requirements.txt \
            -r apps/restaurant-api/requirements-dev.txt
      - name: Run complete Python discovery
        env:
          PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/apps/restaurant-api
        run: python -m pytest -q

  workbench:
    name: Workbench validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/forge-yaml-workbench
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/forge-yaml-workbench/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run csp:check
      - run: npm audit

  console-go:
    name: ForgeOps Console Go validation
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: apps/forgeops-console
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          cache: false
      - name: Verify Go formatting
        run: test -z "$(gofmt -l .)"
      - name: Verify locked Go module graph
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - run: go test ./...
      - run: go vet ./...

  console-web:
    name: ForgeOps Console browser validation
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: apps/forgeops-console/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/forgeops-console/web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build and verify installed native candidate
        run: |
          python ../../../scripts/build-forgeops-console-candidate.py --output-dir "$RUNNER_TEMP/console-candidate"
          python - "$RUNNER_TEMP/console-candidate" <<'PY'
          import pathlib, subprocess, sys
          output = pathlib.Path(sys.argv[1])
          digest, filename = (output / "SHA256SUMS.txt").read_text().strip().split("  ")
          subprocess.run([sys.executable, "../../../scripts/verify-forgeops-console-candidate.py", "--archive", str(output / filename), "--sha256", digest], check=True)
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: forgeops-console-candidate-${{ matrix.os }}
          path: ${{ runner.temp }}/console-candidate/
          if-no-files-found: error
          retention-days: 14

  repository:
    name: Repository and manifest validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install pyyaml==6.0.2
      - name: Run tracked repository validators
        run: |
          python scripts/validate-k8s-manifests.py
          python scripts/validate-wiki-front-door.py
          python scripts/validate-alert-rules.py
          python -m unittest tests.test_repository_security -v

  dependencies:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  required:
    name: Gate 4 required validation
    if: always()
    needs: [python, workbench, console-go, console-web, repository, dependencies]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every applicable validation
        env:
          PYTHON_RESULT: ${{ needs.python.result }}
          WORKBENCH_RESULT: ${{ needs.workbench.result }}
          CONSOLE_GO_RESULT: ${{ needs.console-go.result }}
          CONSOLE_WEB_RESULT: ${{ needs.console-web.result }}
          REPOSITORY_RESULT: ${{ needs.repository.result }}
          DEPENDENCY_RESULT: ${{ needs.dependencies.result }}
        run: |
          test "$PYTHON_RESULT" = success
          test "$WORKBENCH_RESULT" = success
          test "$CONSOLE_GO_RESULT" = success
          test "$CONSOLE_WEB_RESULT" = success
          test "$REPOSITORY_RESULT" = success
          test "$DEPENDENCY_RESULT" = success -o "$DEPENDENCY_RESULT" = skipped
