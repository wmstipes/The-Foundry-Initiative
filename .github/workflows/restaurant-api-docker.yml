name: Restaurant API Docker Build

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
    paths:
      - "apps/restaurant-api/**"

  workflow_dispatch:
    inputs:
      source_sha:
        description: "Reviewed full main commit SHA"
        required: true
        type: string

permissions:
  contents: read

env:
  IMAGE_NAME: wmstipes/signalforge-restaurant-api

jobs:
  test:
    name: Test Restaurant API
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/restaurant-api

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: |
          python -m pytest -q

  build-and-push:
    name: Build and Push ARM64 Image
    timeout-minutes: 30
    runs-on: ubuntu-latest
    needs: test
    if: ${{ (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}
    permissions:
      contents: read
      actions: read
    environment: release
    concurrency:
      group: release-publication
      cancel-in-progress: false

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Verify reviewed main source and unused version
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            python scripts/validate-publication.py --image "$IMAGE_NAME" --version "${GITHUB_REF_NAME#v}"
          else
            python scripts/validate-publication.py
          fi

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Prepare Docker tags
        id: docker_tags
        shell: bash
        run: |
          TAGS="${IMAGE_NAME}:latest
          ${IMAGE_NAME}:${GITHUB_SHA}"

          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            TAGS="${TAGS}
          ${IMAGE_NAME}:${VERSION}"
          fi

          echo "tags<<EOF" >> "$GITHUB_OUTPUT"
          echo "$TAGS" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: apps/restaurant-api
          file: apps/restaurant-api/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.docker_tags.outputs.tags }}
