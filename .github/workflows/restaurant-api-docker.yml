name: Restaurant API Docker Build

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"

  workflow_dispatch:

env:
  IMAGE_NAME: wmstipes/signalforge-restaurant-api

jobs:
  test:
    name: Test Restaurant API
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/restaurant-api

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: |
          python -m pytest -q

  build-and-push:
    name: Build and Push ARM64 Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0

      - name: Log in to Docker Hub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Prepare Docker tags
        id: docker_tags
        shell: bash
        run: |
          TAGS="${IMAGE_NAME}:latest
          ${IMAGE_NAME}:${GITHUB_SHA}"

          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            TAGS="${TAGS}
          ${IMAGE_NAME}:${VERSION}"
          fi

          echo "tags<<EOF" >> "$GITHUB_OUTPUT"
          echo "$TAGS" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v7.3.0
        with:
          context: apps/restaurant-api
          file: apps/restaurant-api/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.docker_tags.outputs.tags }}
