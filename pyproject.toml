[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "signalforge-forgeops"
version = "1.0.0"
description = "Deterministic, bounded SignalForge incident-copilot tooling."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Michael Stipes" }
]
dependencies = []

[project.urls]
Repository = "https://github.com/wmstipes/The-Foundry-Initiative"
Documentation = "https://github.com/wmstipes/The-Foundry-Initiative#readme"

[project.scripts]
forgeops = "forgeops.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["forgeops*"]
