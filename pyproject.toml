[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "foundry-check"
version = "0.2.0"
description = "Local Foundry checks and deterministic SignalForge health snapshots."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "The Foundry Initiative" }
]
dependencies = []

[project.scripts]
foundry-check = "foundry_check.cli:main"
forgeops = "forgeops.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
